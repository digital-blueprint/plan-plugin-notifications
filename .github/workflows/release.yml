name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Lint PHP
        shell: bash
        run: git ls-files -z -- '*.php' | xargs -0 -n1 php -l

      - name: Build release files
        id: build
        shell: bash
        run: |
          version=$(python3 scripts/prepare-release.py "$RUNNER_TEMP/plugin-release")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          tag="v$VERSION"
          ref="refs/tags/$tag"
          asset="Notifications-$VERSION.zip"
          package_dir="$RUNNER_TEMP/plugin-release"

          remote_tag=$(git ls-remote --refs origin "$ref")
          if [[ -z "$remote_tag" ]]; then
            git push origin "$GITHUB_SHA:$ref"
          else
            git fetch --no-tags origin "$ref"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]]; then
              echo "::error::$tag already points to a different commit. Bump the version and update CHANGELOG.md."
              exit 1
            fi
          fi

          if release=$(gh release view "$tag" --json isDraft,assets); then
            if jq -e --arg asset "$asset" '(.isDraft | not) and any(.assets[]; .name == $asset)' <<< "$release" > /dev/null; then
              echo "$tag is already published with $asset."
              exit 0
            fi
            echo "::error::An incomplete release already exists for $tag. Inspect it before retrying."
            exit 1
          fi

          gh release create "$tag" "$package_dir/$asset" \
            --verify-tag --title "$tag" --notes-file "$package_dir/release-notes.md"
